<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teacher account</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #17251f; background: #f4f8f4; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      main { width: min(440px, 100%); padding: 30px; border: 1px solid #dce8e0; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(31, 71, 52, .12); }
      h1 { margin: 0 0 6px; font-size: 1.55rem; letter-spacing: -.04em; }
      p { margin: 0 0 20px; color: #6a7b74; line-height: 1.5; font-size: .9rem; }
      label { display: block; margin: 14px 0 6px; color: #245d45; font-size: .78rem; font-weight: 750; }
      input { width: 100%; padding: 12px 13px; border: 1px solid #dce8e0; border-radius: 11px; font: inherit; outline: none; }
      input:focus { border-color: #73aa88; box-shadow: 0 0 0 4px rgba(115, 170, 136, .14); }
      button { width: 100%; margin-top: 20px; padding: 12px 14px; border: 0; border-radius: 11px; color: #fff; background: #236b4d; font: inherit; font-weight: 800; cursor: pointer; }
      button:hover { background: #174735; }
      .status { min-height: 20px; margin: 12px 0 0; color: #a43d3d; font-size: .78rem; line-height: 1.4; }
      .status.ok { color: #236b4d; }
      .security { margin-top: 18px; color: #7b8a84; font-size: .72rem; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <h1>Teacher account</h1>
      <p>Create an account to use the managed college-application mailbox.</p>
      <form id="account-form">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" required />
        <label for="email">Google account email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="password">Portal password</label>
        <input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required />
        <label for="access-code">Access code</label>
        <input id="access-code" name="access-code" type="password" minlength="12" autocomplete="one-time-code" required />
        <button type="submit">Create teacher account</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
      <div class="security">Account creation is completed by the private Apps Script backend. Passwords must never be shared in this page, GitHub, or a Sheet as plain text.</div>
    </main>
    <script>
      const APP_SCRIPT_URL = "https://script.google.com/macros/s/REPLACE_WITH_PORTAL_DEPLOYMENT_ID/exec";
      const form = document.getElementById("account-form");
      const status = document.getElementById("status");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (APP_SCRIPT_URL.includes("REPLACE_WITH_")) {
          status.textContent = "The secure account backend is not connected yet.";
          return;
        }
        status.textContent = "Open the secure Apps Script account page to finish registration.";
        status.className = "status ok";
        window.location.href = APP_SCRIPT_URL;
      });
    </script>
  </body>
</html>
